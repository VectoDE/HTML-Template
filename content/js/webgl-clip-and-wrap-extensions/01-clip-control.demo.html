<script type="application/json" data-demo-meta>
  {
    "title": "Switch the clip origin and depth range",
    "summary": "Request EXT_clip_control, call clipControl() with an origin and a depth mode, and read both values back. Use it when ported rendering code expects an upper-left origin or a 0 to 1 depth range.",
    "a11y": "The result is written to an output element that is announced politely, and the button is a real button with a visible focus ring.",
    "fallback": "Where the extension is missing the page prints that it is unavailable and which setup would offer it. Nothing throws.",
    "features": ["api.EXT_clip_control"],
    "detect": "!!document.createElement('canvas').getContext('webgl2')?.getExtension('EXT_clip_control')",
    "runsIn": "frame"
  }
</script>

<template data-lang="html">
  <button type="button" id="run">Set upper-left origin, 0 to 1 depth</button>
  <output id="out" aria-live="polite">Not run yet.</output>
</template>

<template data-lang="css">
  body { font: 1rem/1.4 system-ui, sans-serif; } button:focus-visible { outline:
  3px solid #1f4e9c; outline-offset: 2px; } output { display: block;
  margin-block-start: 0.75rem; white-space: pre-wrap; }
</template>

<template data-lang="js">
  const out = document.querySelector('#out');
  document.querySelector('#run').addEventListener('click', () => { const gl =
  document.createElement('canvas').getContext('webgl2'); if (!gl) {
  out.textContent = 'WebGL 2 is not available here.'; return; } const ext =
  gl.getExtension('EXT_clip_control'); if (!ext) { out.textContent =
  'EXT_clip_control is not offered by this browser or graphics driver.'; return;
  } ext.clipControl(ext.UPPER_LEFT_EXT, ext.ZERO_TO_ONE_EXT); const origin =
  gl.getParameter(ext.CLIP_ORIGIN_EXT) === ext.UPPER_LEFT_EXT ? 'upper left' :
  'lower left'; const depth = gl.getParameter(ext.CLIP_DEPTH_MODE_EXT) ===
  ext.ZERO_TO_ONE_EXT ? '0 to 1' : '-1 to 1'; out.textContent = `Clip origin:
  ${origin}\nDepth range: ${depth}`; });
</template>
