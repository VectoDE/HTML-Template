version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      # Weekly data must not wait a second week.
      exclude:
        - '@mdn/browser-compat-data'
        - web-features
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps)'
    groups:
      compat-data:
        patterns:
          - '@mdn/browser-compat-data'
          - web-features
        update-types: [major, minor, patch]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
