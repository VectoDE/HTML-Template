name: Bug report
description: Something on the site is broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe what you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The page URL and the steps that lead to the problem.
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 150 on Windows 11
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Console errors, screenshots, or the shared link of an edited demo.
