name: tmp-coverage-update

on:
  workflow_dispatch:

permissions: {}

jobs:
  update:
    if: github.ref == 'refs/heads/dependabot/npm_and_yarn/minor-and-patch-e97ed01910'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run coverage:update
      - run: npm run coverage
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/coverage
          git diff --cached --stat
          git commit --signoff -m "chore(coverage): Offene Eintraege nach dem Datenupdate nachziehen" -m "npm run coverage:update traegt die zehn neuen border-*-radius-Eigenschaften als offen ein."
          git push origin HEAD:${GITHUB_REF_NAME}
