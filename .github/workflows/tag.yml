name: tag

# Closing a stage issue from .github/release-stages.json as completed creates
# the next version tag and starts the signed release for it.
on:
  issues:
    types: [closed]

permissions: {}

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check the guards and pick the version
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NUMBER: ${{ github.event.issue.number }}
          STATE_REASON: ${{ github.event.issue.state_reason }}
          AUTHOR: ${{ github.event.issue.user.login }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          skip() {
            echo "::notice title=No release tag::$1"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$STATE_REASON" != "completed" ]; then
            skip "issue $NUMBER was closed as $STATE_REASON"
          fi
          channel="$(node scripts/release/guards.mjs channel .github/release-stages.json "$NUMBER")"
          if [ -z "$channel" ]; then
            skip "issue $NUMBER is not listed in release-stages.json"
          fi
          if [ "$AUTHOR" != "$OWNER" ]; then
            skip "issue $NUMBER was opened by $AUTHOR, expected $OWNER"
          fi
          role="$(gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .role_name 2>/dev/null || true)"
          case "$role" in
            admin | maintain) ;;
            *) skip "$SENDER closed the issue without the admin or maintain role" ;;
          esac
          sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          gh api --paginate --slurp \
            "repos/$REPO/actions/runs?head_sha=$sha&branch=main&event=push&per_page=100" \
            > "$RUNNER_TEMP/runs.json"
          failing="$(node scripts/release/guards.mjs runs "$RUNNER_TEMP/runs.json" "$sha")"
          if [ -n "$failing" ]; then
            skip "required workflows on main $sha did not succeed: $failing"
          fi
          node scripts/release/next.mjs "$channel" > "$RUNNER_TEMP/next.txt"
          tag="$(sed -n 's/^tag=//p' "$RUNNER_TEMP/next.txt")"
          if gh api "repos/$REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
            skip "tag $tag already exists"
          fi
          {
            cat "$RUNNER_TEMP/next.txt"
            echo "sha=$sha"
            echo "ok=true"
          } >> "$GITHUB_OUTPUT"
      - name: Create the tag
        if: steps.guard.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.guard.outputs.tag }}
          SHA: ${{ steps.guard.outputs.sha }}
        run: gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" > /dev/null
      # A tag created with GITHUB_TOKEN does not trigger the push event, so
      # the release is started explicitly on the new tag.
      - name: Start the release
        if: steps.guard.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.guard.outputs.tag }}
        run: gh workflow run release.yml --repo "$REPO" --ref "$TAG"
      - name: Comment on the issue
        if: steps.guard.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          NUMBER: ${{ github.event.issue.number }}
          TAG: ${{ steps.guard.outputs.tag }}
          SHA: ${{ steps.guard.outputs.sha }}
        run: |
          runs="$SERVER/$REPO/actions/workflows/release.yml?query=branch%3A$TAG"
          body="Tagged \`$TAG\` on $SHA. The signed release is being built: $runs"
          gh issue comment "$NUMBER" --repo "$REPO" --body "$body"
