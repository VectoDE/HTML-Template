name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release/version.mjs "$TAG" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Package source archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="html-template-${VERSION}/" \
            -o "dist/html-template-${VERSION}.tar.gz" "$GITHUB_SHA"
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Collect SBOM and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SBOM: ${{ runner.temp }}/sbom.spdx.json
        run: |
          mv "$SBOM" "dist/html-template-${VERSION}.spdx.json"
          node scripts/release/notes.mjs "$VERSION" > dist/notes.md
      - name: Hash release assets
        id: hash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: dist
        run: |
          hashes="$(sha256sum "html-template-${VERSION}.tar.gz" "html-template-${VERSION}.spdx.json" | base64 -w0)"
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # NOSONAR the SLSA generator must be referenced by tag to verify its builder identity
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: html-template-${{ needs.build.outputs.version }}.intoto.jsonl
      upload-assets: false

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release assets
        env:
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: dist
        run: |
          for asset in "html-template-${VERSION}.tar.gz" "html-template-${VERSION}.spdx.json"; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signatures
          path: dist/*.sigstore.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, provenance, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        working-directory: assets
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$REPO" --verify-tag \
            --title "HTML-Template ${VERSION}" --notes-file notes.md \
            "${flags[@]}" \
            "html-template-${VERSION}.tar.gz" \
            "html-template-${VERSION}.spdx.json" \
            "html-template-${VERSION}.tar.gz.sigstore.json" \
            "html-template-${VERSION}.spdx.json.sigstore.json" \
            "html-template-${VERSION}.intoto.jsonl"
