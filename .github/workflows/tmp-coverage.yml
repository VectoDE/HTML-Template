name: tmp-coverage
on:
  push:
    branches: [docs/coverage-25-border-radius-webgl]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npx prettier --write content/css content/js
      - run: npm run build 2>&1 | tee build.log
      - run: npm run coverage:update 2>&1 | tee update.log
      - run: npm run coverage 2>&1 | tee check.log
      - if: always()
        run: git diff --stat > stat.log; git diff content/coverage > coverage.diff; true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out
          path: |
            content
            *.log
            coverage.diff
